<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UCAB-Services | Secretaría Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">UCAB-Services | Operaciones de Secretaría</a>
            <div class="d-flex align-items-center">
                <span class="badge bg-warning text-dark me-3">Módulo Administrativo</span>
                <a th:href="@{/inicio(correo=${correo})}" class="btn btn-sm btn-outline-light">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h3 class="fw-bold mb-1">Gestión Académica Central</h3>
        <p class="text-muted mb-4">Administración de catálogo de materias, inscripciones y carga docente.</p>

        <div class="alert alert-success alert-dismissible fade show shadow-sm" th:if="${param.exito}">
            <strong>¡Éxito!</strong> <span th:text="${param.exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show shadow-sm" th:if="${param.error}">
            <strong>Atención:</strong> <span th:text="${param.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100 border-top border-dark border-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">1. Registrar Asignatura</h5>
                        <form th:action="@{/admin/academico/curso/guardar}" method="post">
                            <input type="hidden" name="correo" th:value="${correo}">
                            <div class="mb-3">
                                <label class="form-label small text-muted">Código del Curso</label>
                                <input type="text" class="form-control" name="codigoCurso" placeholder="Ej: IN4411" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small text-muted">Nombre de la Materia</label>
                                <input type="text" class="form-control" name="nombreMateria" placeholder="Ej: Bases de Datos I" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">Crear Materia</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100 border-top border-primary border-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 text-primary">2. Inscribir Estudiante</h5>
                        <form th:action="@{/admin/academico/inscribir}" method="post">
                            <input type="hidden" name="correo" th:value="${correo}">
                            <div class="mb-3">
                                <label class="form-label small text-muted">Seleccione la Materia</label>
                                <select class="form-select" name="codigoCurso" required>
                                    <option th:each="curso : ${listaCursos}" th:value="${curso.codigoCurso}" th:text="${curso.codigoCurso} + ' - ' + ${curso.nombreMateria}"></option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small text-muted">Cédula del Estudiante</label>
                                <input type="text" class="form-control border-primary" name="cedulaEstudiante" placeholder="Ej: V-28000111" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Procesar Inscripción</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 h-100 border-top border-success border-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 text-success">3. Carga Docente</h5>
                        <form th:action="@{/admin/academico/asignar}" method="post">
                            <input type="hidden" name="correo" th:value="${correo}">
                            <div class="mb-3">
                                <label class="form-label small text-muted">Seleccione la Materia</label>
                                <select class="form-select" name="codigoCurso" required>
                                    <option th:each="curso : ${listaCursos}" th:value="${curso.codigoCurso}" th:text="${curso.codigoCurso} + ' - ' + ${curso.nombreMateria}"></option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small text-muted">Cédula del Profesor</label>
                                <input type="text" class="form-control border-success" name="cedulaProfesor" placeholder="Ej: V-15000222" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Asignar Profesor</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
