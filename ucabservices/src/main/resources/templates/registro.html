<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UCAB-Services - Registro de Perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="container container-wide">
        <h2>Registro de Perfil - UCAB-Services</h2>
        <div id="alertBox" class="alert" style="display: none;"></div>
        
        <form id="registroForm">
            <div class="grid-2">
                <div class="form-group">
                    <label>Cédula de Identidad</label>
                    <input type="text" id="cedula" required placeholder="Ej: V-12345678">
                </div>
                <div class="form-group">
                    <label>Nombres Completos</label>
                    <input type="text" id="nombres" required>
                </div>
                <div class="form-group">
                    <label>Apellidos Completos</label>
                    <input type="text" id="apellidos" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select id="genero" required>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Calle/Avenida</label>
                    <input type="text" id="calle" required>
                </div>
                <div class="form-group">
                    <label>Zona/Urbanización</label>
                    <input type="text" id="zona" required>
                </div>
                <div class="form-group">
                    <label>Ciudad</label>
                    <input type="text" id="ciudad" required>
                </div>
                <div class="form-group">
                    <label>Teléfono Móvil</label>
                    <input type="tel" id="telefono" required placeholder="Ej: 04141234567">
                </div>
                <div class="form-group">
                    <label>Correo Institucional</label>
                    <input type="email" id="correoInstitucional" required placeholder="usuario@est.ucab.edu.ve">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="contrasena" required>
                </div>
                
                <div class="form-group">
                    <label>Rol Institucional (Vinculación)</label>
                    <select id="rolSeleccionado" required>
                        <option value="" disabled selected>Seleccione su rol de ingreso</option>
                        <option value="Estudiante">Estudiante de Pregrado</option>
                        <option value="Profesor">Personal Docente</option>
                        <option value="Personal Administrativo">Personal Administrativo</option>
                        <option value="Egresado">Egresado</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 20px; width: 100%;">Registrar Miembro</button>
        </form>
        
        <p style="text-align: center; margin-top: 15px;">
            ¿Ya eres miembro? <a href="/login" style="color: #004b87; font-weight: bold;">Ingresa aquí</a>
        </p>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            // Armamos el payload con el DTO que espera el controlador
            const payload = {
                usuario: {
                    cedula: document.getElementById('cedula').value,
                    nombres: document.getElementById('nombres').value,
                    apellidos: document.getElementById('apellidos').value,
                    fechaNacimiento: document.getElementById('fechaNacimiento').value,
                    genero: document.getElementById('genero').value,
                    calle: document.getElementById('calle').value,
                    zona: document.getElementById('zona').value,
                    ciudad: document.getElementById('ciudad').value,
                    telefono: document.getElementById('telefono').value,
                    correoInstitucional: document.getElementById('correoInstitucional').value,
                    contrasena: document.getElementById('contrasena').value
                },
                rolSeleccionado: document.getElementById('rolSeleccionado').value
            };

            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                alertBox.style.display = 'block';
                
                if (data.status === 'success') {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = "¡Usuario registrado exitosamente! Redirigiendo al login...";
                    document.getElementById('registroForm').reset();
                    
                    // Redirección automática al login en 1.5 segundos
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.mensaje || "Error al registrar.";
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = "No se pudo conectar al backend de Spring Boot.";
            }
        });
    </script>
</body>
</html>
