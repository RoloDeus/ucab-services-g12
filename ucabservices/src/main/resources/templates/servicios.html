<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Servicio Publicado</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 20px; background: #222; color: white; border: none; cursor: pointer; }
  #mensaje { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
  #mensaje.ok { background: #d4edda; color: #155724; display: block; }
  #mensaje.error { background: #f8d7da; color: #721c24; display: block; }
  table { width: 100%; margin-top: 30px; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
</style>
</head>
<body>
 
<h1>Registrar Servicio Publicado</h1>
 
<form id="formServicio">
  <label>Categoría</label>
  <select id="categoria" required></select>
 
  <label>Sede</label>
  <select id="sede" required></select>
 
  <label>Entidad Prestadora</label>
  <select id="entidad" required></select>
 
  <label>Descripción</label>
  <input type="text" id="descripcion" required>
 
  <label>Precio base (USD)</label>
  <input type="number" step="0.01" id="precioBase" required>
 
  <label>Ajuste de ubicación (USD)</label>
  <input type="number" step="0.01" id="ajuste" value="0">
 
  <button type="submit">Publicar Servicio</button>
</form>
 
<div id="mensaje"></div>
 
<h2>Servicios publicados</h2>
<!-- NOTA: esta tabla todavía no tiene paginado/búsqueda/orden.
     Se agrega como mejora transversal a todas las tablas más adelante. -->
<table id="tablaServicios">
  <thead>
    <tr><th>ID</th><th>Categoría</th><th>Sede</th><th>Descripción</th><th>Precio USD</th><th>Ajuste</th></tr>
  </thead>
  <tbody></tbody>
</table>
 
<script>
async function cargarSelect(url, elementId, valueField, labelField) {
  const res = await fetch(url);
  const datos = await res.json();
  const select = document.getElementById(elementId);
  select.innerHTML = '';
  datos.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item[valueField];
    opt.textContent = item[labelField];
    select.appendChild(opt);
  });
}
 
async function cargarTabla() {
  const res = await fetch('/api/servicios');
  const datos = await res.json();
  const tbody = document.querySelector('#tablaServicios tbody');
  tbody.innerHTML = '';
  datos.forEach(s => {
    const fila = document.createElement('tr');
    fila.innerHTML = `<td>${s.id_servicio}</td><td>${s.nombre_categoria}</td><td>${s.nombre_sede}</td>
                       <td>${s.descripcion_detallada}</td><td>${s.precio_base_institucional}</td>
                       <td>${s.ajuste_ubicacion}</td>`;
    tbody.appendChild(fila);
  });
}
 
document.getElementById('formServicio').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cuerpo = {
    categoria: document.getElementById('categoria').value,
    idEntidad: Number(document.getElementById('entidad').value),
    sede: document.getElementById('sede').value,
    descripcion: document.getElementById('descripcion').value,
    precioBase: Number(document.getElementById('precioBase').value),
    ajuste: Number(document.getElementById('ajuste').value)
  };
 
  const res = await fetch('/api/servicios', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo)
  });
  const resultado = await res.json();
  const mensajeDiv = document.getElementById('mensaje');
 
  if (res.ok) {
    mensajeDiv.className = 'ok';
    mensajeDiv.textContent = resultado.mensaje;
    document.getElementById('formServicio').reset();
    cargarTabla();
  } else {
    mensajeDiv.className = 'error';
    mensajeDiv.textContent = resultado.error;
  }
});
 
cargarSelect('/api/servicios/categorias', 'categoria', 'nombre_categoria', 'nombre_categoria');
cargarSelect('/api/servicios/sedes', 'sede', 'nombre_sede', 'nombre_sede');
cargarSelect('/api/servicios/entidades', 'entidad', 'id_entidad', 'nombre_entidad');
cargarTabla();
</script>
 
</body>
</html>
