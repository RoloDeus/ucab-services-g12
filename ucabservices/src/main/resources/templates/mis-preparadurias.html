<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCAB-Services | Mis Preparadurías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { background-color: #f8f9fa; min-height: 100vh; padding-top: 20px; border-right: 1px solid #dee2e6; }
        .sidebar-heading { font-size: 0.75rem; font-weight: bold; color: #6c757d; text-transform: uppercase; margin: 15px 20px 5px; }
        .nav-link { color: #495057; font-weight: 500; padding: 8px 20px; }
        .nav-link:hover, .nav-link.active { background-color: #e9ecef; color: #0d6efd; border-radius: 5px; margin: 0 10px; padding: 8px 10px; }
        .sortable-link { color: #212529; text-decoration: none; }
        .sortable-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">UCAB-Services | Mi Perfil</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="sidebar-heading">Mi Perfil</div>
                <nav class="nav flex-column mb-4">
                    <a class="nav-link" th:href="@{/perfil/academico(correo=${correo})}">Ficha Académica</a>
                    <a class="nav-link active" th:href="@{/perfil/mis-preparadurias(correo=${correo})}">Mis Preparadurías</a>
                </nav>
            </div>

            <div class="col-md-9 col-lg-10 p-4 bg-light">
                <h3 class="fw-bold mb-4">Historial de Preparadurías</h3>

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="px-4 py-3">
                                        <a class="sortable-link" th:href="@{/perfil/mis-preparadurias(correo=${correo}, page=${currentPage}, sortField='asignaturaAsignada', sortDir=${reverseSortDir})}">
                                            Asignatura <span th:if="${sortField == 'asignaturaAsignada'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-center">
                                        <a class="sortable-link" th:href="@{/perfil/mis-preparadurias(correo=${correo}, page=${currentPage}, sortField='horasAyudantia', sortDir=${reverseSortDir})}">
                                            Horas de Ayudantía <span th:if="${sortField == 'horasAyudantia'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col" class="px-4 py-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prep : ${pagina.content}">
                                    <td class="px-4 py-3 fw-medium" th:text="${prep.asignaturaAsignada}">Materia</td>
                                    <td class="px-4 py-3 text-center" th:text="${prep.horasAyudantia} + ' hrs'">0 hrs</td>
                                    <td class="px-4 py-3 text-center">
                                        <button class="btn btn-sm btn-outline-primary">Ver Reporte</button>
                                    </td>
                                </tr>
                                <tr th:if="${pagina.empty}">
                                    <td colspan="3" class="text-center py-4 text-muted">No hay preparadurías registradas.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="card-footer bg-white border-0 py-3 d-flex justify-content-between align-items-center" th:if="${pagina.totalPages > 1}">
                        <small class="text-muted" th:text="'Página ' + (${currentPage} + 1) + ' de ' + ${pagina.totalPages}"></small>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/perfil/mis-preparadurias(correo=${correo}, page=${currentPage - 1}, sortField=${sortField}, sortDir=${sortDir})}">Anterior</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                                <a class="page-link" th:href="@{/perfil/mis-preparadurias(correo=${correo}, page=${i}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == pagina.totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/perfil/mis-preparadurias(correo=${correo}, page=${currentPage + 1}, sortField=${sortField}, sortDir=${sortDir})}">Siguiente</a>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
